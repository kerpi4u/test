<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --accent: #22d3ee;
      --text: #e2e8f0;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1) 70%);
      color: var(--text);
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      animation: rise 0.9s ease-out both;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 5rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 1.25rem 0 2rem;
      font-size: 1.05rem;
      color: #94a3b8;
    }

    button {
      font: inherit;
      font-weight: 600;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.5);
      background: rgba(34, 211, 238, 0.12);
      color: var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      background: rgba(34, 211, 238, 0.22);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
      transform: translateY(-2px);
    }

    button:active { transform: translateY(0); }

    #out {
      margin-top: 1.5rem;
      min-height: 1.5rem;
      font-size: 1.1rem;
      color: var(--accent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, World!</h1>
    <p>Простой статический сайт на чистом HTML, CSS и JavaScript.</p>
    <button id="greet">Поздороваться 👋</button>
    <div id="out" aria-live="polite"></div>
  </main>

  <script>
    const out = document.getElementById("out");
    const greetings = ["Привет!", "Hello!", "Hola!", "Bonjour!", "Ciao!", "Привет из JavaScript ✨"];

    document.getElementById("greet").addEventListener("click", () => {
      out.textContent = greetings[Math.floor(Math.random() * greetings.length)];
    });
  </script>
</body>
</html>
