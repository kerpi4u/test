<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — страница не найдена</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e1b4b, #05070f 65%);
      color: #e9edf7;
      text-align: center;
    }
    .code {
      font-size: clamp(5rem, 22vw, 11rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(100deg, #22d3ee, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { font-size: clamp(1.2rem, 3vw, 1.6rem); margin: 0.5rem 0 0.75rem; }
    p { margin: 0 auto 1.75rem; max-width: 46ch; color: #98a3ba; }
    a {
      display: inline-block;
      padding: 0.7rem 1.3rem;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.5);
      background: rgba(34, 211, 238, 0.12);
      color: #22d3ee;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a:hover { transform: translateY(-2px); background: rgba(34, 211, 238, 0.22); }
    .hint { margin-top: 1.5rem; font-size: 0.8rem; color: #6d7891; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Такой страницы здесь нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Домой — всегда можно.</p>
    <a href="./">← Вернуться на главную</a>
    <p class="hint">This page could not be found · <a href="./" style="border:0;background:none;padding:0;color:inherit;text-decoration:underline">Go home</a></p>
  </main>
</body>
</html>
